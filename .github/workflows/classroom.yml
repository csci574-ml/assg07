name: GitHub Classroom Workflow

on: [push]

jobs:
  build-linux:
    permissions: write-all
    name: Autograding
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Set PYTHONPATH to see project modules
      run: |
         echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base

    - name: Show Python versions
      id: show-python-versions
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Show Python versions'
        setup-command: ''
        command: 'python src/python_versions.py'
        timeout: '10'
        max-score: '0'

    - name: Test Assignment Notebook runs all cells cleanly
      id: test-assignment-notebook
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Assignment Notebook'
        working-directory: './notebooks'
        setup-command: ''
        command: 'jupyter nbconvert --execute Assg-07-KMeans-and-PCA.ipynb --to notebook'
        timeout: '10'
        max-score: '20'

    - name: Task 1 test task_1_1_load_data()
      id: test-task-1-1
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 1.1'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_task_1_1_load_data'
        timeout: '10'
        max-score: '5'

    - name: Task test find_closest_centroids()
      id: test-task-1-2
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 2'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_find_closest_centroids'
        timeout: '10'
        max-score: '10'

    - name: Task test compute_centroids()
      id: test-task-1-3
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 3.1'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_compute_centroids'
        timeout: '10'
        max-score: '10'

    - name: Task test kmeans_cluster()
      id: test-task-1-4
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 3.2'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_kmeans_cluster'
        timeout: '10'
        max-score: '5'

    - name: Task 2 test task_2_1_load_data()
      id: test-task-2-1
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 4'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_task_2_1_load_data'
        timeout: '10'
        max-score: '5'

    - name: Task test feature_normalize()
      id: test-task-2-2
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 5'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_feature_normalize'
        timeout: '10'
        max-score: '5'

    - name: Task test pca()
      id: test-task-2-3
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 6'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_pca'
        timeout: '10'
        max-score: '10'

    - name: Task test project_data()
      id: test-task-2-4
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 6'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_project_data'
        timeout: '10'
        max-score: '5'

    - name: Task test recover_data()
      id: test-task-2-5
      uses: etamu-class/autograding-command-grader@v10
      with:
        test-name: 'Test Task 6'
        setup-command: ''
        command: 'python -m twisted.trial test_assg_tasks.test_recover_data'
        timeout: '10'
        max-score: '5'

    - name: Autograding Reporter
      uses: education/autograding-grading-reporter@v1
      env:
        TEST-ASSIGNMENT-NOTEBOOK_RESULTS: "${{steps.test-assignment-notebook.outputs.result}}"
        TEST-TASK-1-1_RESULTS: "${{steps.test-task-1-1.outputs.result}}"
        TEST-TASK-1-2_RESULTS: "${{steps.test-task-1-2.outputs.result}}"
        TEST-TASK-1-3_RESULTS: "${{steps.test-task-1-3.outputs.result}}"
        TEST-TASK-1-4_RESULTS: "${{steps.test-task-1-4.outputs.result}}"
        TEST-TASK-2-1_RESULTS: "${{steps.test-task-2-1.outputs.result}}"
        TEST-TASK-2-2_RESULTS: "${{steps.test-task-2-2.outputs.result}}"
        TEST-TASK-2-3_RESULTS: "${{steps.test-task-2-3.outputs.result}}"
        TEST-TASK-2-4_RESULTS: "${{steps.test-task-2-4.outputs.result}}"
        TEST-TASK-2-5_RESULTS: "${{steps.test-task-2-5.outputs.result}}"
      with:
        runners: test-assignment-notebook,test-task-1-1,test-task-1-2,test-task-1-3,test-task-1-4,test-task-2-1,test-task-2-2,test-task-2-3,test-task-2-4,test-task-2-5
